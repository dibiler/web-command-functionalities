<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>PWACommands - Offline</title>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #09090b;
            color: #e4e4e7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .card {
            width: min(92vw, 42rem);
            border: 1px solid #3f3f46;
            background: #111114;
            border-radius: 12px;
            padding: 1.25rem;
        }
        h1 {
            margin: 0 0 .5rem;
            font-size: 1rem;
            color: #34d399;
        }
        p {
            margin: .35rem 0;
            color: #a1a1aa;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>PWACommands (Offline)</h1>
        <p>The app shell is available offline.</p>
        <p>If this is your first visit, reconnect once so resources can be cached for offline access.</p>
    </div>
</body>
</html>
